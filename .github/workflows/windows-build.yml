name: Windows installer validation

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and test application
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build a clean Windows installer
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'autoquotes-installer-stage'
          $output = Join-Path $env:RUNNER_TEMP 'autoquotes-installer-output'
          ./installer/build-windows.ps1 -StageDir $stage -OutputDir $output
      - name: Install and smoke-test the bundled application
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'autoquotes-installer-output/AutoQuotes-Free-Windows-1.0.0-Setup.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'autoquotes-installed'
          $dataDir = Join-Path $env:RUNNER_TEMP 'autoquotes-test-data'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon',("/DIR=`"$installDir`"")) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'AutoQuotes Free.lnk'
          if (-not (Test-Path $desktopShortcut)) { throw 'Desktop shortcut was not created' }
          $node = Join-Path $installDir 'node/node.exe'
          $app = Join-Path $installDir 'app'
          if (Test-Path (Join-Path $app 'node_modules/playwright-core/.local-browsers')) { throw 'Browser was bundled in the installer' }
          $originalLocalAppData = $env:LOCALAPPDATA
          $env:LOCALAPPDATA = $dataDir
          $userData = Join-Path $dataDir 'AutoQuotes Free'
          $browserDir = Join-Path $userData 'browsers'
          # Exercise the production detached-window path, then confirm repeat use is offline.
          $originalCI = $env:CI
          $env:CI = 'false'
          # Preserve the native exit code so diagnostics run even when Node exits nonzero.
          $originalNativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          & $node (Join-Path $installDir 'browser-install.mjs') $app $node $browserDir
          $browserSetupExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $originalNativePreference
          $env:CI = $originalCI
          if ($browserSetupExit -ne 0) {
            $log = Join-Path $userData 'logs/browser-setup.log'
            Write-Host "Browser setup exit code: $browserSetupExit"
            Write-Host "Transcript exists: $(Test-Path $log)"
            if (Test-Path $log) { Get-Content $log -ErrorAction Continue }
            Write-Host "Browser directory exists: $(Test-Path $browserDir)"
            if (Test-Path $userData) { Get-ChildItem -Recurse $userData -ErrorAction Continue | Select-Object -First 50 -ExpandProperty FullName }
            throw 'Installed first-run browser setup failed'
          }
          & $node (Join-Path $installDir 'browser-install.mjs') $app $node $browserDir
          if ($LASTEXITCODE -ne 0) { throw 'Installed cached browser validation failed' }
          # Invoke the real launcher with an isolated per-user directory.
          # The launcher starts a long-running server, so waiting for its process
          # tree would block until the user closes the app. Poll health instead.
          $launch = Start-Process -FilePath 'wscript.exe' -ArgumentList @("`"$installDir/launch.vbs`"") -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              $launch.Refresh()
              if ($launch.HasExited -and $launch.ExitCode -ne 0) { throw 'Installed launcher failed' }
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:3000/api/health' -TimeoutSec 2
                if ($health.success) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Installed launcher did not start the server' }
            $customers = Invoke-RestMethod 'http://127.0.0.1:3000/api/customers'
            if (@($customers.data).Count -ne 0) { throw 'Installed app did not start with an empty database' }
            $quote = Invoke-RestMethod 'http://127.0.0.1:3000/api/quotes' -Method Post -ContentType 'application/json' -Body '{}'
            $pdf = Join-Path $env:RUNNER_TEMP 'autoquotes-test.pdf'
            Invoke-WebRequest "http://127.0.0.1:3000/api/exports/pdf/$($quote.data.id)/view" -OutFile $pdf
            if (-not (Test-Path $pdf) -or (Get-Item $pdf).Length -lt 100) { throw 'Downloaded browser did not generate a PDF' }
          } finally {
            Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'node.exe' -and $_.CommandLine -like '*autoquotes-installed*dist*main.js*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            $env:LOCALAPPDATA = $originalLocalAppData
          }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
          if (-not (Test-Path (Join-Path $userData 'data/autoquote.db'))) { throw 'Uninstall removed user data' }
      - name: Add checksum for the test installer
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'autoquotes-installer-output/AutoQuotes-Free-Windows-1.0.0-Setup.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          Set-Content -Path "$file.sha256" -Value "$hash  AutoQuotes-Free-Windows-1.0.0-Setup.exe" -Encoding ascii
      - name: Save test installer
        uses: actions/upload-artifact@v4
        with:
          name: AutoQuotes-Free-Windows-1.0.0-test
          path: ${{ runner.temp }}/autoquotes-installer-output/*
          if-no-files-found: error
          retention-days: 7
